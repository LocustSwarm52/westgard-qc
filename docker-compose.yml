# One command runs the app and a PostgreSQL database:
#   docker compose up --build
# Then open http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: qc
      POSTGRES_PASSWORD: qc
      POSTGRES_DB: qc
    volumes:
      - qcdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qc"]
      interval: 2s
      retries: 20
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://qc:qc@db:5432/qc
      SECRET_KEY: change-this-to-a-long-random-string-before-deploying
    depends_on:
      db:
        condition: service_healthy
volumes:
  qcdata:
